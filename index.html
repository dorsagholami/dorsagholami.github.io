<style>

.site.t-rec{--bg:#0A0909;--ink:#F4F1EF;--mute:#A19B98;--accent:#FF5242;--on-acc:#0A0909;--s0:#100F0F;--s1:#131212;--s1h:#141313;--s2:#161515;--s3:#1B1A1A;--s4:#232222;--s5:#292827;--acc-deep:#1E0F0E;--acc-mute:#B48C87;--ink-2:#BAB5B2;--deep:#060505;--bg-rgb:10 9 9;--ink-rgb:244 241 239;--mute-rgb:161 155 152;--acc-rgb:255 82 66;--deep-rgb:6 5 5}

*,*::before,*::after{box-sizing:border-box}

.skip:focus{top:16px;color:var(--on-acc)}

/* smooth scroll: Lenis runs on desktop only. Minimal CSS instead of the stock file (which blocks pointer events on iframes) */

/* opening: thin letterbox mattes retract; the hero stays visible underneath */
.lbx{position:fixed;left:0;right:0;height:9vh;background:var(--deep);z-index:600;pointer-events:none;animation:lbxT var(--dur-reveal) var(--ease-out) .14s both}
.lbx-t{top:0}
.lbx-b{bottom:0;animation-name:lbxB}
.lbx-b::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent);transform:scaleX(0);animation:seam var(--dur-slow) var(--ease-out) both}
@keyframes seam{to{transform:scaleX(1)}}
@keyframes lbxT{to{transform:translateY(-100%);visibility:hidden}}
@keyframes lbxB{to{transform:translateY(100%);visibility:hidden}}

/* nav: .scrolled after 8px; hides on scroll down */
.nav{position:sticky;top:0;z-index:60;border-bottom:1px solid transparent;transition:transform var(--dur-slow) var(--ease-out),background-color var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out)}
.nav.scrolled{background:rgb(var(--bg-rgb) / .82);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom-color:rgb(var(--ink-rgb) / .08)}

.nav-link:hover{color:var(--ink)}
.nav-link:hover::after{transform:scaleX(1);transform-origin:left}
.desk{display:flex}
.mob{display:none}
@media (max-width:900px){.desk{display:none}.mob{display:inline-flex}}
@media (min-width:901px){.mob-menu{display:none}}
.mob-menu{animation:menuIn var(--dur-base) var(--ease-out) both}
@keyframes menuIn{from{opacity:0}}
.mob-menu>*{animation:wf var(--dur-slow) var(--ease-out) backwards;animation-delay:calc(var(--i, 0) * 35ms)}

.menu-btn{appearance:none;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgb(var(--ink-rgb) / .22);background:transparent;color:var(--ink);cursor:pointer;align-items:center;gap:10px;font:500 14px/1 Inter,system-ui,sans-serif;transition:border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}

@supports (animation-timeline: scroll()){.progress{opacity:1;animation:prog linear both;animation-timeline:scroll(root)}}

/* Apple-style scroll-linked motion: reveals follow the scroll position instead of playing once.
   Only where scroll timelines exist; other browsers keep the one-shot reveals above. */
@supports (animation-timeline: view()){
.js .reveal{animation:apRise linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
@keyframes apRise{from{opacity:0;transform:translateY(28px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

@keyframes apMedia{from{opacity:0;transform:translateY(32px) scale(.93)}to{opacity:1;transform:none}}

@keyframes apHero{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-32px) scale(.97)}}
}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;height:56px;padding:0 28px;border-radius:999px;border:1px solid transparent;font:600 15px/1 Inter,system-ui,sans-serif;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;isolation:isolate;cursor:pointer;transition:color var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out),background-color var(--dur-base) var(--ease-out),transform var(--dur-fast) var(--ease-out)}

.btn-sm{height:44px;padding:0 20px;font-size:14px}
.btn-lg{height:auto;min-height:clamp(64px,6vw,84px);padding:18px clamp(26px,3vw,44px);border-radius:48px;font-size:clamp(16px,1.4vw,20px);line-height:1.25;white-space:normal;text-align:left}
/* press feedback */
.btn:active,.tab:active,.icon-btn:active,.copy:active,.menu-btn:active,.seg:active{transform:scale(.98)}
.reel-play:active .ring{transform:scale(.98)}
/* primary CTA sheen: one sweep when first seen, one per hover, never looping */
.btn-shimmer::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 30%,rgb(var(--ink-rgb) / .45) 50%,transparent 70%);transform:translateX(-110%);pointer-events:none}

@keyframes shineA{from{transform:translateX(-110%)}to{transform:translateX(110%)}}

.btn:hover .arr.ur svg + svg,.soc:hover .arr.ur svg + svg{transform:none}
.lnk{position:relative;display:inline-flex;align-items:center;gap:10px}
.lnk::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform var(--dur-slow) var(--ease-out)}
.lnk:hover::after{transform:scaleX(1);transform-origin:left}
.icon-btn{appearance:none;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgb(var(--ink-rgb) / .2);background:rgb(var(--bg-rgb) / .5);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}

/* hero: lines and blocks only slide, never hide, so the LCP text is instant */
.ln{display:block}
.ln>span{display:inline-block}
.hero-ln>span,.fu{animation:heroIn var(--dur-reveal) var(--ease-out) both}
@keyframes heroIn{from{transform:translateY(14px)}}

/* scroll reveal: hidden states exist only under .js, so print and reduced motion always show content */
.js .reveal:not(.in){opacity:0;transform:translateY(14px);filter:blur(6px)}
.js .reveal.revealing{transition:opacity var(--dur-reveal) var(--ease-out),transform var(--dur-reveal) var(--ease-out),filter var(--dur-reveal) var(--ease-out)}
.js .reveal.revealing[data-d="1"]{transition-delay:.07s}
.js .reveal.revealing[data-d="2"]{transition-delay:.14s}
.js .reveal.revealing[data-d="3"]{transition-delay:.21s}
.js .reveal.revealing[data-d="4"]{transition-delay:.28s}
.js .reveal.revealing[data-d="5"]{transition-delay:.35s}
/* section headings: word-by-word blur-in (the signature effect) */
.wh .wl{display:block}

.js .wh.revealing .w{transition:opacity var(--dur-reveal) var(--ease-out),transform var(--dur-reveal) var(--ease-out),filter var(--dur-reveal) var(--ease-out);transition-delay:calc(var(--wi) * 40ms)}

/* small motion details */
.pulse{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

.mq-wrap:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.spin{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* live timecode (CSS only) */
@property --tcs{syntax:'<integer>';inherits:false;initial-value:0}
@property --tcf{syntax:'<integer>';inherits:false;initial-value:0}
.tc{counter-reset:tcs var(--tcs) tcf var(--tcf);animation:tcF 1s steps(24) infinite,tcS 60s steps(60) infinite}
.tc .s::after{content:counter(tcs,decimal-leading-zero)}
.tc .f::after{content:counter(tcf,decimal-leading-zero)}
@keyframes tcF{from{--tcf:0}to{--tcf:24}}

/* hero monitor */
.grain{position:absolute;left:-50%;top:-50%;width:200%;height:200%;pointer-events:none;opacity:.08;mix-blend-mode:screen;animation:grain 1.4s steps(7) infinite}
@keyframes grain{0%{transform:translate(0,0)}15%{transform:translate(-4%,-6%)}30%{transform:translate(6%,3%)}45%{transform:translate(-7%,5%)}60%{transform:translate(3%,-7%)}75%{transform:translate(-3%,8%)}90%{transform:translate(7%,-2%)}100%{transform:translate(0,0)}}
.grain-off .grain{display:none}
.cb{position:absolute;width:18px;height:18px;border:0 solid var(--accent);pointer-events:none}
.cb.tl{top:10%;left:7%;border-top-width:1.5px;border-left-width:1.5px;transform:translate(-1px,-1px)}
.cb.tr{top:10%;right:7%;border-top-width:1.5px;border-right-width:1.5px;transform:translate(1px,-1px)}
.cb.bl{bottom:10%;left:7%;border-bottom-width:1.5px;border-left-width:1.5px;transform:translate(-1px,1px)}
.cb.br{bottom:10%;right:7%;border-bottom-width:1.5px;border-right-width:1.5px;transform:translate(1px,1px)}

@media (max-width:640px){.gallery{--rowH:190px;gap:36px 14px}}

.tab:hover{color:var(--ink);border-color:rgb(var(--ink-rgb) / .36)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--on-acc)}
.tab .cnt{font:500 11px/1 'JetBrains Mono',ui-monospace,monospace;opacity:.65}
/* cards: staggered entrance (waits until the gallery is on screen), replays on filter change */
.card{position:relative;min-width:0;animation:cardA var(--dur-reveal) var(--ease-out) both}
.card.anim-b{animation-name:cardB}

@keyframes cardA{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardB{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.thumb{appearance:none;position:relative;display:block;width:100%;padding:0;margin:0;border:0;border-radius:6px;overflow:hidden;background:var(--s1);color:var(--ink);cursor:pointer;text-align:left;transition:transform var(--dur-base) var(--ease-out),filter var(--dur-base) var(--ease-out)}

<script src="js/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    /* .js before first paint: reveal hidden states only ever exist when JS is running */
    try { document.documentElement.classList.add('js'); } catch (err) {}
    this.c = this.content();
    this.items = this.prepare(this.c);
    this.clients = [];
    this.items.forEach((p) => { if (p.client && this.clients.indexOf(p.client) < 0) this.clients.push(p.client); });
    const openSlots = this.items.filter((p) => p.ph).map((p) => p.slot);
    const noClips = this.items.filter((p) => !p.ph && !p.preview && !p.thumb).length;
    const phParts = [];
    if (noClips) phParts.push(noClips + (noClips === 1 ? ' preview clip' : ' preview clips'));
    if (openSlots.length) phParts.push('open slots ' + openSlots.join(', '));
    this.workPh = phParts.length ? 'Replace · ' + phParts.join(' · ') : '';
    this.heroBars = this.wave(96, 1.7, 0.43, 22);
    this.apBars = this.wave(36, 2.3, 0.61, 30);
    const T = (id, h, clips) => ({
      id: id, h: h, wave: !clips, hasClips: !!clips,
      clips: (clips || []).map((x) => ({ g: x[0], cls: 'hc k-' + x[1], t: x[2] || '' }))
    });
    this.heroTracks = [
      T('V2', '22px', [[7, 'gap'], [5, 'gfx', 'TITLE'], [13, 'gap'], [6, 'gfx', 'LOWER THIRD'], [11, 'gap'], [6, 'gfx', 'CAPTIONS'], [8, 'gap'], [5, 'gfx', 'END CARD']]),
      T('V1', '30px', [[4, 'hl', 'HOOK'], [8, 'v', 'INTRO'], [9, 'v', 'A-ROLL'], [4, 'v', 'B-ROLL'], [8, 'v', 'A-ROLL'], [3, 'v', 'CUT'], [10, 'v', 'STORY'], [5, 'v', 'B-ROLL'], [7, 'v', 'OUTRO']]),
      T('A1', '30px', null),
      T('A2', '22px', [[36, 'mus', 'MUSIC — BED'], [2, 'gap'], [20, 'mus', 'MUSIC — OUTRO']])
    ];
    this.state = { filter: 'all', anim: 0, openId: '', menuOpen: false, navHidden: false, navSolid: false, step: 0, stepAnim: 0, copied: false };
    this.lastY = 0;
    this.ticking = false;
    this.pausedUntil = 0;
    this.apVisible = false;
    this.wasOpen = false;
    this.onScroll = this.onScroll.bind(this);
    this.copyEmail = this.copyEmail.bind(this);
    this.toggleMenu = () => this.setState({ menuOpen: !this.state.menuOpen, navHidden: false });
    this.closeMenu = () => { if (this.state.menuOpen) this.setState({ menuOpen: false }); };
    this.openReel = () => this.setState({ openId: 'reel', menuOpen: false });
    this.closeModal = () => this.setState({ openId: '' });
    this.prevItem = () => this.stepModal(-1);
    this.nextItem = () => this.stepModal(1);
    this.prevStep = () => this.pickStep((this.state.step + this.c.principles.length - 1) % this.c.principles.length);
    this.nextStep = () => this.pickStep((this.state.step + 1) % this.c.principles.length);
  }

  /* ───────────────────────── CONTENT — edit here ─────────────────────────
     REPLACE every placeholder below with your real work.
     Media: upload files to this canvas and paste the /_blob/... URL.
       thumb   = thumbnail image (shown instead of the placeholder frame)
       preview = short MP4 that loops silently on the card, GIF-style, while it is on screen
                 (3–6 s, 960 px wide or less, under 2 MB; the audio is muted)
       url     = clicking the card opens this link (YouTube, Vimeo…) in a new tab
       video   = only used when there is no url: MP4 shown in the on-page player
     ratio: '16:9' | '9:16' | '4:5' | '1:1' | '2.39:1'
  ───────────────────────────────────────────────────────────────────────── */
  content() {
    return {
      showreel: { loop: 'assets/showreel-loop.mp4', full: 'assets/showreel.mp4', url: '' },
      categories: [
        { id: 'longform', label: 'YouTube Long-form', code: 'LF' },
        { id: 'shorts', label: 'Shorts & Reels', code: 'SR' },
        { id: 'lifestyle', label: 'Lifestyle & Vlogs', code: 'LV' },
        { id: 'creative', label: 'Creative Projects', code: 'CP' }
      ],
      projects: [
        /* kind = label above the title · client/channel = who it was edited for · note = optional highlight
           ph: true = open slot still waiting for a real project (shows a REPLACE tag) */
        { id: 'lf-01', cat: 'longform', kind: 'Educational · Long-form', title: 'The Complete Roadmap to Starting a YouTube Channel from Scratch and Earning Your First Income', client: 'Bahare Salehnia', channel: '@Bahare', note: 'Most-viewed video on the channel', ratio: '16:9', duration: '', desc: '', thumb: 'assets/lf-01-thumb.jpg', preview: 'assets/lf-01-preview.mp4', video: '', url: 'https://youtu.be/fqFnC_8OxxI', art: [72, 34, 46, 64] },
        { id: 'lv-01', cat: 'lifestyle', kind: 'YouTube vlog', title: 'Yalda Night Vlog', client: 'Bahare Salehnia', channel: '@Baharedailyvlog', ratio: '16:9', duration: '', desc: '', thumb: 'assets/lv-01-thumb.jpg', preview: 'assets/lv-01-preview.mp4', video: '', url: 'https://youtu.be/62S-yWm1vIw', art: [30, 40, 52, 58] },
        { id: 'sr-02', cat: 'shorts', kind: 'YouTube Shorts', title: '5 YouTube Channel Ideas for International Audiences', client: 'Bahare Salehnia', channel: '@Bahare', ratio: '9:16', duration: '', desc: '', thumb: 'assets/sr-02-thumb.jpg', preview: 'assets/sr-02-preview.mp4', video: '', url: 'https://www.youtube.com/shorts/shgWTaoFJ_w', art: [60, 62, 56, 40] },
        { id: 'lv-04', cat: 'lifestyle', kind: 'Travel & food-tasting vlog', title: 'Persian Food in USA', client: 'Loghme', channel: '@loghme7', ratio: '16:9', duration: '', desc: '', thumb: 'assets/lv-04-thumb.jpg', preview: 'assets/lv-04-preview.mp4', video: '', url: 'https://youtu.be/K7L0JVOemrY', art: [80, 50, 40, 60] },
        { id: 'lf-02', cat: 'longform', kind: 'Educational · Long-form', title: 'How to Take Luxury Photos of Rings?', client: 'Bahare Salehnia', channel: '@Bahare', ratio: '16:9', duration: '', desc: '', thumb: 'assets/lf-02-thumb.jpg', preview: 'assets/lf-02-preview.mp4', video: '', url: 'https://youtu.be/bcFVrYO7KBg', art: [24, 30, 50, 66] },
        { id: 'lv-05', cat: 'lifestyle', kind: 'Travel & food-tasting vlog', title: 'The Biggest Chocolate Store in New York', client: 'Loghme', channel: '@loghme7', ratio: '16:9', duration: '', desc: '', thumb: 'assets/lv-05-thumb.jpg', preview: 'assets/lv-05-preview.mp4', video: '', url: 'https://youtu.be/Finq0WyO2lc', art: [64, 24, 48, 70] },
        { id: 'lv-03', cat: 'lifestyle', kind: 'Travel & food-tasting vlog', title: 'The Strangest Foods in Rasht', client: 'Loghme', channel: '@loghme7', ratio: '16:9', duration: '', desc: '', thumb: 'assets/lv-03-thumb.jpg', preview: 'assets/lv-03-preview.mp4', video: '', url: 'https://youtu.be/Vexw01do4Gk', art: [50, 50, 44, 50] }
      ],
      principles: [
        { track: 'V1', title: 'Storytelling & Narrative Flow', short: 'STORY', l: 0, w: 32, ghosts: [[35, 49], [52, 70], [73, 84], [87, 100]], desc: 'Every edit starts with structure: a strong opening, a clear reason to keep watching, and an ending that lands.', tags: ['Structure', 'Hooks', 'Payoff'] },
        { track: 'V2', title: 'Pacing & Retention', short: 'PACING', l: 18, w: 32, ghosts: [[0, 15], [53, 64], [67, 88], [91, 100]], desc: 'Rhythm that respects the viewer’s time — trimming dead air, building momentum, and holding attention where it matters most.', tags: ['Rhythm', 'Momentum', 'Retention'] },
        { track: 'V3', title: 'Visual Details & Motion Graphics', short: 'DETAILS', l: 38, w: 28, ghosts: [[4, 14], [17, 34], [70, 80], [84, 96]], desc: 'Clean titles, purposeful motion and consistent color — the small details that make a video feel finished.', tags: ['Titles', 'Motion', 'Color'] },
        { track: 'FX', title: 'Creative Problem Solving', short: 'SOLVE', l: 74, w: 26, ghosts: [[8, 22], [40, 54], [57, 70]], desc: 'Missing shots, messy footage or tight deadlines — finding the edit that still tells the story.', tags: ['Fixes', 'Ideas', 'Flexibility'] }
      ]
    };
  }

  prepare(c) {
    const cats = {};
    c.categories.forEach((k) => { cats[k.id] = k; });
    const counters = {};
    return c.projects.map((p, i) => {
      const parts = String(p.ratio || '16:9').split(':').map(Number);
      const ar = parts[0] / parts[1];
      const k = cats[p.cat] || c.categories[0];
      counters[p.cat] = (counters[p.cat] || 0) + 1;
      const a = p.art || [60, 40, 50, 62];
      const s = ar.toFixed(4);
      return Object.assign({}, p, {
        ar: ar,
        catLabel: k.label,
        code: k.code + '—' + String(counters[p.cat]).padStart(2, '0'),
        arCss: parts[0] + ' / ' + parts[1],
        format: p.ratio,
        flex: s + ' ' + s + ' calc(' + s + ' * var(--rowH))',
        maxW: 'calc(' + s + ' * var(--rowH) * 1.9)',
        artBg: 'radial-gradient(circle at ' + a[0] + '% ' + a[1] + '%, rgb(var(--ink-rgb) / 0.11), rgb(var(--ink-rgb) / 0) ' + a[2] + '%), var(--s1)',
        hz: a[3] + '%',
        hasThumb: !!p.thumb, noThumb: !p.thumb, hasPreview: !!p.preview,
        kind: p.kind || k.label,
        slot: String(i + 1).padStart(2, '0'),
        ph: !!p.ph,
        hasPh: !!p.ph || (!p.preview && !p.thumb),
        phLabel: p.ph ? 'Replace · open slot' : 'Replace · preview clip',
        hasDuration: !!p.duration && !p.ph,
        hasDesc: !!p.desc,
        client: p.client || '',
        hasClient: !!p.client,
        channelSep: p.channel ? ' · ' + p.channel : '',
        note: p.note || '',
        hasNote: !!p.note,
        watchLabel: /youtu/.test(p.url || '') ? 'Watch on YouTube' : 'Watch full video',
        hasUrl: !!p.url,
        noUrl: !p.url,
        linkLabel: p.url ? (/youtu/.test(p.url) ? 'Watch “' + p.title + '” on YouTube' : 'Watch “' + p.title + '”') + ' (opens in a new tab)' : 'Open ' + p.title,
        playerMaxW: ar < 0.7 ? '380px' : ar < 0.9 ? '560px' : ar < 1.2 ? '680px' : ar > 2 ? '1280px' : '1120px'
      });
    });
  }

  wave(n, a, b, min) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const v = Math.abs(Math.sin(i * a) * Math.cos(i * b)) * 0.7 + Math.abs(Math.sin(i * 0.21)) * 0.3;
      out.push({ h: Math.round(min + v * (100 - min)) + '%' });
    }
    return out;
  }

  componentDidMount() {
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.fine = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
    document.documentElement.classList.add('js');
    if ('IntersectionObserver' in window) {
      /* one observer for every reveal: blocks, word headings, the gallery and the CTA sheen */
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (en.isIntersecting) { this.io.unobserve(en.target); this.reveal(en.target); }
        });
      }, { threshold: 0.16, rootMargin: '0px 0px -8% 0px' });
      /* infinite loops only run in sections that are on screen */
      this.loopIO = new IntersectionObserver((entries) => {
        entries.forEach((en) => en.target.classList.toggle('motion-paused', !en.isIntersecting));
      });
      document.querySelectorAll('section, footer').forEach((el) => this.loopIO.observe(el));
      this.apIO = new IntersectionObserver((entries) => {
        entries.forEach((en) => { this.apVisible = en.isIntersecting; });
      }, { threshold: 0.25 });
      const ap = document.getElementById('approach');
      if (ap) this.apIO.observe(ap);
    } else {
      this.apVisible = true;
    }
    this.observe();
    this.initLenis();
    this.initTilt();
    if (!this.reduce && 'IntersectionObserver' in window) {
      this.pvIO = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          const v = en.target;
          if (en.isIntersecting && !document.hidden) this.playMuted(v);
          else if (!v.paused) v.pause();
        });
      }, { rootMargin: '120px 0px', threshold: 0.15 });
    }
    this.observePreviews();
    this.onVis = () => {
      document.documentElement.classList.toggle('motion-paused', document.hidden);
      document.querySelectorAll('video[data-preview]').forEach((v) => { if (document.hidden && !v.paused) v.pause(); });
      if (!document.hidden && this.pvIO) { this.pvIO.disconnect(); this.observePreviews(); }
    };
    document.addEventListener('visibilitychange', this.onVis);
    this.lastY = window.scrollY || 0;
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll, { passive: true });
    this.onScroll();
    if (!this.reduce) {
      this.timer = setInterval(() => {
        if (!this.apVisible || document.hidden || this.state.openId || Date.now() < this.pausedUntil) return;
        const n = this.c.principles.length;
        this.setState({ step: (this.state.step + 1) % n, stepAnim: this.state.stepAnim + 1 });
      }, 4200);
    }
    this.playLoops();
  }

  componentDidUpdate() {
    this.observe();
    const open = !!this.state.openId;
    if (open && !this.wasOpen) {
      this.lastFocus = document.activeElement;
      document.documentElement.style.overflow = 'hidden';
      setTimeout(() => { const b = document.getElementById('player-close'); if (b) b.focus(); }, 40);
    } else if (!open && this.wasOpen) {
      document.documentElement.style.overflow = '';
      if (this.lastFocus && this.lastFocus.focus) { try { this.lastFocus.focus({ preventScroll: true }); } catch (err) {} }
    }
    this.wasOpen = open;
    this.playLoops();
    this.observePreviews();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
    if (this.io) this.io.disconnect();
    if (this.apIO) this.apIO.disconnect();
    if (this.pvIO) this.pvIO.disconnect();
    document.removeEventListener('visibilitychange', this.onVis);
    clearInterval(this.timer);
    clearTimeout(this.copyT);
    document.documentElement.style.overflow = '';
    document.documentElement.classList.remove('motion-paused');
    if (this.loopIO) this.loopIO.disconnect();
    if (this.lockMO) this.lockMO.disconnect();
    if (this.lenisWait) window.removeEventListener('load', this.lenisWait);
    if (this.onAnchor) window.removeEventListener('click', this.onAnchor, true);
    if (this.lenis) { this.lenis.destroy(); this.lenis = null; }
    (this.tilts || []).forEach((t) => { t[0].removeEventListener('pointermove', t[1]); t[0].removeEventListener('pointerleave', t[2]); });
  }

  observe() {
    const els = document.querySelectorAll('.reveal:not(.in), .wh:not(.in), .gallery:not(.in), .btn-shimmer:not(.seen)');
    if (!this.io) { els.forEach((el) => el.classList.add('in', 'seen')); return; }
    els.forEach((el) => this.io.observe(el));
  }

  /* on enter: will-change only while moving, removed again on transitionend (never left on) */
  reveal(el) {
    if (el.classList.contains('btn-shimmer')) {
      el.classList.add('seen');
      if (!this.reduce) {
        el.classList.add('shine');
        el.addEventListener('animationend', () => el.classList.remove('shine'), { once: true });
      }
      return;
    }
    const block = el.classList.contains('reveal');
    const words = el.classList.contains('wh');
    if (this.reduce || (!block && !words)) { el.classList.add('in'); return; }
    let timer = 0;
    const done = () => {
      clearTimeout(timer);
      el.removeEventListener('transitionend', onEnd);
      el.classList.remove('revealing');
      el.style.willChange = '';
    };
    const onEnd = (e) => { if (e.target === el && e.propertyName === 'opacity') done(); };
    if (block) { el.style.willChange = 'opacity, transform, filter'; el.addEventListener('transitionend', onEnd); }
    el.classList.add('revealing', 'in');
    const delay = (parseInt(el.getAttribute('data-d') || '0', 10) || 0) * 70;
    const stagger = words ? el.querySelectorAll('.w').length * 40 : 0;
    timer = setTimeout(done, 700 + delay + stagger + 150);
  }

  /* smooth scroll: desktop pointer only, never under reduced motion, never in a frame that does not scroll */
  initLenis() {
    if (this.lenis || this.reduce || !this.fine) return;
    const L = window.Lenis;
    if (typeof L !== 'function') {
      if (document.readyState !== 'complete' && !this.lenisWait) {
        this.lenisWait = () => { this.lenisWait = null; this.initLenis(); };
        window.addEventListener('load', this.lenisWait, { once: true });
      }
      return;
    }
    const vh = window.innerHeight || 0;
    if (!vh || vh > 2000 || document.documentElement.scrollHeight < vh * 1.2) return;
    const scrollable = (n) => {
      if (!(n instanceof Element) || n === document.documentElement || n === document.body) return false;
      const oy = getComputedStyle(n).overflowY;
      return (oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 1;
    };
    this.lenis = new L({ duration: 1.0, autoRaf: true, prevent: (node) => node.hasAttribute('data-lenis-prevent') || scrollable(node) });
    /* pause while something locks scroll (the video player sets overflow: hidden on <html>) */
    this.lockMO = new MutationObserver(() => this.syncLenisLock());
    this.lockMO.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
    this.lockMO.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
    this.syncLenisLock();
    /* in-page anchors: glide to the target under the sticky header, then record the hash */
    this.onAnchor = (e) => {
      if (!this.lenis || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a || a.classList.contains('skip')) return;
      const id = a.getAttribute('href').slice(1);
      const target = id ? document.getElementById(id) : null;
      if (id && !target) return;
      e.preventDefault();
      e.stopPropagation();
      const nav = document.querySelector('.nav');
      const head = nav ? nav.offsetHeight : 0;
      this.lenis.scrollTo(target || 0, { offset: target ? -head : 0 });
      if (id) { try { history.pushState(null, '', '#' + id); } catch (err) {} }
    };
    window.addEventListener('click', this.onAnchor, true);
  }

  syncLenisLock() {
    if (!this.lenis) return;
    const locked = document.documentElement.style.overflow === 'hidden' || document.body.style.overflow === 'hidden';
    if (locked) this.lenis.stop(); else this.lenis.start();
  }

  /* pointer tilt: desktop only, rAF-throttled, settles back with --dur-base */
  initTilt() {
    if (this.reduce || !this.fine) return;
    this.tilts = [];
    document.querySelectorAll('[data-tilt]').forEach((el) => {
      const max = Math.min(7, parseFloat(el.getAttribute('data-tilt')) || 7);
      let raf = 0, px = 0.5, py = 0.5;
      const apply = () => {
        raf = 0;
        el.style.transform = 'perspective(1200px) rotateX(' + ((0.5 - py) * 2 * max).toFixed(2) + 'deg) rotateY(' + ((px - 0.5) * 2 * max).toFixed(2) + 'deg)';
      };
      const move = (e) => {
        const r = el.getBoundingClientRect();
        if (!r.width || !r.height) return;
        px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        el.style.transition = 'transform var(--dur-fast) var(--ease-out)';
        if (!raf) raf = requestAnimationFrame(apply);
      };
      const leave = () => {
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        el.style.transition = 'transform var(--dur-base) var(--ease-out)';
        el.style.transform = '';
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerleave', leave);
      this.tilts.push([el, move, leave]);
    });
  }

  onScroll() {
    if (this.ticking) return;
    this.ticking = true;
    requestAnimationFrame(() => {
      this.ticking = false;
      const y = window.scrollY || window.pageYOffset || 0;
      const dy = y - this.lastY;
      this.lastY = y;
      const solid = y > 8;
      let hidden = this.state.navHidden;
      if (this.state.menuOpen || y < 140) hidden = false;
      else if (dy > 4) hidden = true;
      else if (dy < -4) hidden = false;
      if (solid !== this.state.navSolid || hidden !== this.state.navHidden) this.setState({ navSolid: solid, navHidden: hidden });
      if (!this.reduce) this.parallax();
    });
  }

  parallax() {
    const vh = window.innerHeight || 800;
    document.querySelectorAll('[data-parallax]').forEach((el) => {
      const box = el.parentElement;
      if (!box) return;
      const r = box.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) return;
      const f = parseFloat(el.getAttribute('data-parallax')) || 0;
      const lim = r.height * 0.1;
      let off = ((r.top + r.height / 2) - vh / 2) * -f;
      off = Math.max(-lim, Math.min(lim, off));
      el.style.transform = 'translate3d(0,' + off.toFixed(1) + 'px,0)';
    });
  }

  playLoops() {
    if (this.reduce) return;
    document.querySelectorAll('video[data-loop]').forEach((v) => {
      if (v.paused) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    });
  }

  /* GIF-style card previews: muted loops that play only while on screen */
  playMuted(v) {
    v.muted = true; v.defaultMuted = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  }

  observePreviews() {
    if (!this.pvIO) return;
    document.querySelectorAll('video[data-preview]').forEach((v) => this.pvIO.observe(v));
  }

  visibleList() {
    const f = this.state.filter;
    return f === 'all' ? this.items : this.items.filter((p) => p.cat === f);
  }

  setFilter(id) {
    if (id === this.state.filter) return;
    this.setState({ filter: id, anim: this.state.anim + 1 });
  }

  stepModal(dir) {
    const list = this.visibleList();
    const i = list.findIndex((p) => p.id === this.state.openId);
    if (i < 0 || !list.length) return;
    this.setState({ openId: list[(i + dir + list.length) % list.length].id });
  }

  pickStep(i) {
    this.pausedUntil = Date.now() + 15000;
    if (i !== this.state.step) this.setState({ step: i, stepAnim: this.state.stepAnim + 1 });
  }

  copyEmail() {
    const el = document.getElementById('contact-email');
    if (!el) return;
    const text = (el.textContent || '').trim();
    const done = () => {
      this.setState({ copied: true });
      clearTimeout(this.copyT);
      this.copyT = setTimeout(() => this.setState({ copied: false }), 2200);
    };
    const fallback = () => {
      try {
        const r = document.createRange();
        r.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        const ok = document.execCommand('copy');
        sel.removeAllRanges();
        if (ok) done();
      } catch (err) {}
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  renderVals() {
    const s = this.state;
    const c = this.c;
    const themeIds = { 'Tungsten': 'tungsten', 'Rec Red': 'rec', 'Night Blue': 'night', 'Rose': 'rose', 'Mono': 'mono', 'Lime': 'lime' };
    const themeId = themeIds[this.props.theme ?? 'Tungsten'] || 'tungsten';
    const showMarkers = this.props.showMarkers ?? false;
    const grain = this.props.grain ?? true;

    const filters = [{ id: 'all', label: 'All' }].concat(c.categories.filter((k) => this.items.some((p) => p.cat === k.id))).map((f) => {
      const on = s.filter === f.id;
      const count = f.id === 'all' ? this.items.length : this.items.filter((p) => p.cat === f.id).length;
      return { label: f.label, count: String(count).padStart(2, '0'), cls: on ? 'tab on' : 'tab', pressed: on ? 'true' : 'false', pick: () => this.setFilter(f.id) };
    });

    const visible = this.visibleList().map((p, i) => Object.assign({}, p, {
      delay: (Math.min(i, 8) * 0.07).toFixed(2) + 's',
      open: () => this.setState({ openId: p.id })
    }));

    let m = { title: '', kind: '', format: '', arCss: '16 / 9', maxW: '1120px', desc: '', video: '', url: '', client: '', channelSep: '', note: '', isProject: false };
    if (s.openId === 'reel') {
      m = { title: 'Showreel', kind: 'Showreel', format: '16:9', arCss: '16 / 9', maxW: '1280px', desc: 'A short cut of moments from the projects below: long-form YouTube, Shorts and vlogs.', video: c.showreel.full, url: c.showreel.url, client: '', channelSep: '', note: '', isProject: false };
    } else if (s.openId) {
      const p = this.items.find((x) => x.id === s.openId);
      if (p) m = { title: p.title, kind: p.kind, format: p.format, arCss: p.arCss, maxW: p.playerMaxW, desc: p.desc, video: p.video, url: p.url, client: p.client, channelSep: p.channelSep, note: p.note, isProject: true };
    }
    m.hasVideo = !!m.video; m.noVideo = !m.video; m.hasUrl = !!m.url; m.noUrl = !m.url;
    m.hasClient = !!m.client; m.hasDesc = !!m.desc; m.hasNote = !!m.note;
    m.watchLabel = /youtu/.test(m.url || '') ? 'Watch on YouTube' : 'Watch full video';

    const P = c.principles;
    const cur = P[s.step] || P[0];
    const principles = P.map((p, i) => Object.assign({}, p, {
      no: String(i + 1).padStart(2, '0'),
      cls: i === s.step ? 'trk on' : 'trk',
      pressed: i === s.step ? 'true' : 'false',
      pick: () => this.pickStep(i),
      left: p.l + '%',
      width: p.w + '%',
      ghosts: p.ghosts.map((g) => ({ left: g[0] + '%', width: (g[1] - g[0]) + '%' })),
      isAudio: !!p.audio
    }));
    const segs = P.map((p, i) => ({ cls: i === s.step ? 'seg on' : 'seg', pressed: i === s.step ? 'true' : 'false', label: 'Show ' + p.title, pick: () => this.pickStep(i) }));

    return {
      rootCls: 't-' + themeId + (showMarkers ? ' ph-on' : ' ph-off') + (grain ? ' grain-on' : ' grain-off'),
      navCls: ((s.navSolid || s.menuOpen) ? ' scrolled' : '') + ((s.navHidden && !s.menuOpen) ? ' is-hidden' : ''),
      menuOpen: s.menuOpen,
      menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? 'Close' : 'Menu',
      toggleMenu: this.toggleMenu,
      closeMenu: this.closeMenu,
      hasReel: !!c.showreel.loop,
      noReel: !c.showreel.loop,
      reelSrc: c.showreel.loop,
      openReel: this.openReel,
      heroTracks: this.heroTracks,
      heroBars: this.heroBars,
      filters: filters,
      visible: visible,
      clients: this.clients.join(' · '),
      hasClients: this.clients.length > 0,
      workPh: this.workPh,
      hasWorkPh: !!this.workPh,
      animCls: s.anim % 2 ? 'card anim-b' : 'card anim-a',
      modalOpen: !!s.openId,
      m: m,
      closeModal: this.closeModal,
      prevItem: this.prevItem,
      nextItem: this.nextItem,
      principles: principles,
      segs: segs,
      ap: { no: String(s.step + 1).padStart(2, '0'), total: String(P.length).padStart(2, '0'), track: cur.track, title: cur.title, desc: cur.desc, tags: cur.tags.map((t) => ({ t: t })) },
      apBars: this.apBars,
      phX: 'translateX(' + (cur.l + cur.w / 2) + '%)',
      swapCls: s.stepAnim % 2 ? 'swap-b' : 'swap-a',
      prevStep: this.prevStep,
      nextStep: this.nextStep,
      copyEmail: this.copyEmail,
      copyLabel: s.copied ? 'Copied' : 'Copy'
    };
  }
}
DCLite.mount(Component, {"theme": "Tungsten", "grain": true, "showMarkers": false});
</script>
</body>
</html>
